# MAVROS Configuration Override for Vision-based GPS-free Operation
# This file overrides px4_config.yaml to enable vision pose estimation

/**:
  ros__parameters:
    # Global position config - ENABLE VISION
    global_position:
      use_vision: true         # ← KEY FIX: Enable vision pose forwarding to PX4
      tf.listen: false
      tf.send: false
      tf.frame_id: "map"
      tf.child_frame_id: "base_link"
      tf.rate_limit: 50.0      # Match vision bridge rate
      eph: 2.0
      epv: 2.0

    # Vision pose estimate plugin configuration
    vision_pose:
      tf.listen: false           # We publish directly to /mavros/vision_pose/pose
      tf.frame_id: "map"         # Match vision_pose_bridge frame_id
      tf.child_frame_id: "vision_estimate"
      tf.rate_limit: 50.0        # Match vision data rate
