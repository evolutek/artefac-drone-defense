services:
  # PX4 SITL + Gazebo Harmonic Simulation
  simulation:
    build:
      context: ./simulation
      dockerfile: Dockerfile.px4
      args:
        PX4_VERSION: v1.16.0
        UBUNTU_VERSION: jammy
    container_name: artefac_simulation
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/root/.docker.xauth
      - PX4_HOME_LAT=${PX4_HOME_LAT:-43.6047}
      - PX4_HOME_LON=${PX4_HOME_LON:-1.4442}
      - PX4_HOME_ALT=${PX4_HOME_ALT:-0}
      - PX4_SIM_MODEL=${PX4_SIM_MODEL:-gz_x500}
      - HEADLESS=${HEADLESS:-0}
      - PX4_GZ_WORLD=${PX4_GZ_WORLD:-default}
      - GZ_SIM_RESOURCE_PATH=/root/PX4-Autopilot/Tools/simulation/gz/models:/root/PX4-Autopilot/Tools/simulation/gz/worlds:/root/.gz/sim/models:/root/.gz/sim/worlds
    volumes:
      # X11 for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.docker.xauth:/root/.docker.xauth:rw
      # Gazebo Harmonic models and worlds
      - ./simulation/gazebo_worlds:/root/.gz/sim/worlds:rw
      - ./simulation/models:/root/.gz/sim/models:rw
      # PX4 build cache (speeds up subsequent builds)
      - px4_build:/root/PX4-Autopilot/build:rw
      # PX4 logs
      - ./logs/px4:/root/.ros/log:rw
      # Custom startup script
      - ./simulation/start_px4_sitl.sh:/root/start_px4_sitl.sh:ro
    working_dir: /root/PX4-Autopilot
    command: ["bash", "/root/start_px4_sitl.sh"]
    healthcheck:
      test: ["CMD", "bash", "-c", "ps aux | grep -v grep | grep 'gz sim' && ps aux | grep -v grep | grep px4"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ROS2 Integration Layer (MAVROS + MQTT Bridge + Vision Bridge)
  ros2_integration:
    build:
      context: ./simulation
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
        UBUNTU_VERSION: jammy
    container_name: artefac_ros2_integration
    network_mode: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/root/fastdds.xml
      - ROS_LOCALHOST_ONLY=0
      - DISPLAY=${DISPLAY:-:0}
      - FLASK_PORT=8080
    volumes:
      # ROS2 workspace
      - ./simulation/src:/root/ros2_ws/src:rw
      - ./simulation/config:/root/config:ro
      # ROS2 build cache
      - ros2_install:/root/ros2_ws/install:rw
      - ros2_build:/root/ros2_ws/build:rw
      # ROS2 logs
      - ./logs/ros2:/root/.ros/log:rw
      # FastDDS config
      - ./simulation/config/fastdds.xml:/root/fastdds.xml:ro
      # Simulation control scripts (mounted for live updates)
      - ./simulation/spawn_drone.sh:/root/spawn_drone.sh:rw
      - ./simulation/despawn_drone.sh:/root/despawn_drone.sh:rw
      - ./simulation/spawn_zone.sh:/root/spawn_zone.sh:rw
      - ./simulation/despawn_zone.sh:/root/despawn_zone.sh:rw
    working_dir: /root/ros2_ws
    depends_on:
      simulation:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Starting ROS2 Integration Layer (MAVROS, MQTT Bridge, Vision Bridge)...' &&
        source /opt/ros/humble/setup.bash &&
        echo 'Building ROS2 workspace...' &&
        colcon build --symlink-install &&
        source install/setup.bash &&
        echo 'Waiting for PX4 SITL to be ready...' &&
        sleep 5 &&
        echo 'Launching MAVROS (without sim_time)...' &&
        ros2 launch mavros_launcher px4_sitl.launch.py fcu_url:=udp://:14540@127.0.0.1:14580 namespace:=drone_1 &
        MAVROS_PID=\$$! &&
        echo 'Waiting for MAVROS services to be available...' &&
        until source /opt/ros/humble/setup.bash && ros2 service list 2>/dev/null | grep -q 'drone_1/mavros_node/arming'; do
          echo 'Still waiting for MAVROS services...' &&
          sleep 2;
        done &&
        echo 'MAVROS ready! Enabling vision pose forwarding...' &&
        ros2 param set /drone_1/mavros_node global_position.use_vision true &&
        echo 'Vision pose enabled! ✓' &&
        echo 'MAVROS services ready! Launching MQTT Bridge...' &&
        ros2 launch mqtt_bridge mqtt_bridge.launch.py drone_id:=drone_1 mqtt_broker:=localhost &
        MQTT_PID=\$$! &&
        echo 'Waiting for MAVROS to publish state topic...' &&
        until source /opt/ros/humble/setup.bash && ros2 topic list 2>/dev/null | grep -q 'drone_1/state'; do
          echo 'Still waiting for /drone_1/state topic...' &&
          sleep 1;
        done &&
        echo 'MAVROS state topic ready! ✓' &&
        echo 'Launching Simulation Control Server on port 8080...' &&
        python3 /root/simulation_control_server.py &
        FLASK_PID=\$$! &&
        echo 'All services started!' &&
        echo '  - MAVROS (PID: '\$$MAVROS_PID')' &&
        echo '  - MQTT Bridge (PID: '\$$MQTT_PID')' &&
        echo '  - Simulation Control Server (PID: '\$$FLASK_PID')' &&
        wait \$$MAVROS_PID
      "
    healthcheck:
      test: ["CMD", "bash", "-c", "source /opt/ros/humble/setup.bash && ros2 topic list | grep -q mavros"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # MQTT Broker (Mosquitto)
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: artefac_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data:rw
      - mqtt_logs:/mosquitto/log:rw
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # FastAPI Backend (Pure Python, no ROS2 dependency)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.10"
    container_name: artefac_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./backend_data/app.db}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mqtt}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - PYTHONUNBUFFERED=1
    volumes:
      # Backend code (hot reload)
      - ./backend/app:/app/app:rw
      # Database persistence
      - backend_data:/app/backend_data:rw
      # Logs
      - ./logs/backend:/app/logs:rw
    working_dir: /app
    depends_on:
      mqtt:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Starting Backend API...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: artefac_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# Named volumes for caching and persistence
volumes:
  px4_build:
    name: artefac_px4_build
    driver: local
  ros2_install:
    name: artefac_ros2_install
    driver: local
  ros2_build:
    name: artefac_ros2_build
    driver: local
  backend_data:
    name: artefac_backend_data
    driver: local
  mqtt_data:
    name: artefac_mqtt_data
    driver: local
  mqtt_logs:
    name: artefac_mqtt_logs
    driver: local
