<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Evolutek Backoffice Logistique</title>
    <link rel="icon" href="./assets/logo-artifact-ago-white.png" type="image/png" sizes="32x32" />
    <link rel="stylesheet" href="./styles.css" />
    <script>try{if(localStorage.getItem('session_auth')!=='1'){location.href='./login.html'}}catch(e){location.href='./login.html'}</script>
  </head>
  <body>
    <header>
      <div class="row" style="gap:10px; align-items:center; justify-content:flex-start;">
        <img src="./assets/logo-artifact-ago-white.png" alt="Artefac" class="logo" />
        <h1>Backoffice Logistique</h1>
      </div>
      <div class="row" style="margin-top:8px; gap:8px;">
        <button class="btn" data-nav="warehouses">Gérer entrepôts</button>
        <button class="btn" data-nav="products">Produits</button>
        <button class="btn" data-nav="inventory">Inventaire</button>
        <button class="btn" data-nav="stocks">Suivi des stocks</button>
        <button class="btn" data-nav="drones">Drones</button>
        <button class="btn" data-nav="missions" style="margin-left:auto">Suivi des livraisons</button>
      </div>
    </header>

    <main>
      <section id="login" style="display:none">
        <div style="position:relative">
          <canvas id="login-globe" style="width:100%; height: calc(100vh - 160px); display:block; border:1px solid var(--border); border-radius:10px"></canvas>
          <div id="login-card" style="position:fixed; left:50%; top:75%; transform:translate(-50%, -50%); width:min(360px, 92vw); background: rgba(12,16,22,0.85); backdrop-filter: saturate(180%) blur(8px); border:1px solid var(--border); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.25); padding:16px;">
            <div style="text-align:center; font-weight:600; margin-bottom:6px">Entrer le PIN</div>
            <input id="login-pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="9" class="input" placeholder="•••••••••" style="display:block; margin:0 auto; width:min(260px, 100%); text-align:center; font-size:24px; letter-spacing:6px; color:#fff; border:1px solid var(--border)" aria-label="PIN agent" />
            <div id="login-pin-error" style="color:#f44336; text-align:center; margin-top:8px; font-size:13px"></div>
            <div style="display:flex; margin-top:12px"><button type="button" class="btn" style="margin-left:auto" id="login-access-btn">Accéder</button></div>
          </div>
        </div>
      </section>
      <section id="warehouses">
        <h2>Entrepôts</h2>
        <div class="row" style="margin-bottom:8px;">
          <label><input type="checkbox" id="warehouse-filter-fr" checked /> Afficher seulement France</label>
        </div>
        <form id="warehouse-form">
          <input type="text" name="name" placeholder="Nom" required />
          <input type="number" step="any" name="latitude" placeholder="Latitude" required />
          <input type="number" step="any" name="longitude" placeholder="Longitude" required />
          <input type="text" name="address" placeholder="Adresse (optionnel)" />
          <input type="number" name="capacity" placeholder="Capacité (optionnel)" />
          <button type="submit">Ajouter</button>
        </form>
        <div id="warehouse-list"></div>
      </section>

      <section id="products">
        <h2>Produits</h2>
        <div class="row" style="margin-bottom:8px">
          <button id="seed-products" class="btn">Ajouter articles de test</button>
          <span class="muted" style="margin-left:8px">Ajoute un ensemble d’articles démo</span>
        </div>
        <form id="product-form">
          <input type="text" name="name" placeholder="Nom" required />
          <input type="text" name="description" placeholder="Description" />
          <input type="text" name="category" placeholder="Catégorie" />
          <input type="number" step="any" name="weight_kg" placeholder="Poids (kg)" />
          <input type="url" name="image_url" placeholder="Image URL" />
          <input type="file" name="image_file" accept="image/*" capture="environment" />
          <div id="product-image-preview" style="margin-top:6px; display:none">
            <img id="product-image-preview-img" alt="Prévisualisation" style="max-height:80px; border:1px solid var(--border); border-radius:6px; background:rgba(0,0,0,0.2)" />
          </div>
          <button type="submit">Ajouter</button>
        </form>
        <div id="product-list"></div>
      </section>

      <section id="inventory">
        <h2>Inventaire</h2>
        <form id="inventory-form">
          <select name="warehouse_id" required></select>
          <select name="product_id" required></select>
          <input type="number" name="quantity" placeholder="Quantité" required />
          <button type="submit">Enregistrer</button>
        </form>
        <div id="inventory-view"></div>
      </section>

      <section id="stocks">
        <h2>Suivi des stocks</h2>
        <div class="row" style="margin-bottom:8px">
          <select id="stocks-grouping" style="min-width:160px">
            <option value="produits" selected>Par produit</option>
            <option value="entrepots">Par entrepôt</option>
          </select>
          <input id="stocks-filter" type="text" placeholder="Filtrer (produit/entrepôt)" style="flex:1" />
          <button id="seed-inventory" class="btn">Remplir stocks démo</button>
          <div id="stocks-summary" class="muted" style="margin-left:auto"></div>
        </div>
        <div id="stocks-view"></div>
      </section>

      <section id="drones">
        <h2>Drones</h2>
        <form id="drone-form">
          <input type="text" name="drone_id" placeholder="ID unique (ex: drone_2)" required />
          <input type="text" name="name" placeholder="Nom" />
          <input type="text" name="model" placeholder="Modèle (ex: gz_x500)" />
          <button type="submit">Ajouter</button>
        </form>
        <div id="drone-list"></div>
      </section>

      <section id="missions">
        <h2>Suivi des livraisons</h2>
        <div class="row" style="margin-bottom: 10px;">
          <label class="muted">Filtrer par état
            <select id="mission-status-filter">
              <option value="">Tous</option>
              <option value="pending">Préparation</option>
              <option value="assigned">Assignée</option>
              <option value="in_progress">En vol</option>
              <option value="blocked">Bloqué</option>
              <option value="completed">Livré</option>
              <option value="failed">Annulé</option>
            </select>
          </label>
          <button id="mission-refresh" class="btn" style="margin-left:auto">Rafraîchir</button>
        </div>
        <div id="mission-list" class="list"></div>
      </section>

    </main>

    <script src="https://unpkg.com/mgrs@1.0.0/dist/mgrs.js"></script>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="./app.js"></script>
  </body>
  </html>
