<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' http://localhost:5173; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: https://unpkg.com; connect-src 'self' http://localhost:5173 ws://localhost:5173; font-src 'self' data:; object-src 'none'; base-uri 'none'" />
    <title>Occulon – Globe Topographique</title>
    <style>
      html, body { height: 100%; margin: 0; }
      #app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
      header { padding: 8px 12px; background: #0f172a; color: #e2e8f0; display:flex; gap: 12px; align-items: center; }
      header input { width: 100px; padding: 4px 6px; }
      header button { padding: 6px 10px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
      header button:hover { background: #1d4ed8; }
      #globe { position: relative; }
      .hint { color: #94a3b8; font-size: 12px; margin-left: 8px; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <strong>Trajet GPS</strong>
        <label>Lat départ <input id="start-lat" type="number" step="0.000001" value="48.8566" /></label>
        <label>Lon départ <input id="start-lon" type="number" step="0.000001" value="2.3522" /></label>
        <label>Lat arrivée <input id="end-lat" type="number" step="0.000001" value="51.5074" /></label>
        <label>Lon arrivée <input id="end-lon" type="number" step="0.000001" value="-0.1278" /></label>
        <button id="plot">Tracer</button>
        <span class="hint">Conseil: utiliser coordonnées WGS84 (lat/lon)</span>
      </header>
      <div id="globe"></div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
  </html>
