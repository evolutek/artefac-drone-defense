# Local Mosquitto MQTT Broker Configuration (macOS dev)

# Listen on all interfaces
listener 1883
protocol mqtt

# Allow anonymous connections (dev only)
allow_anonymous true

# Persistence (use project-local directories)
persistence true
persistence_location ./mqtt/local_data/

# Logging
log_dest file ./mqtt/local_logs/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

connection_messages true
log_type all

# Performance tuning
max_connections -1
max_queued_messages 1000
message_size_limit 0

# Retained messages
retained_persistence true