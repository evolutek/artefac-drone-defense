# Mosquitto MQTT Broker Configuration
# Artefac Drone Defense - MVP

# Listen on all interfaces
listener 1883
protocol mqtt

# WebSocket listener (optional, for browser clients)
listener 9001
protocol websockets

# Allow anonymous connections (MVP - no auth)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection messages
connection_messages true

# Log all topics (useful for debugging)
log_type all

# Performance tuning
max_connections -1
max_queued_messages 1000
message_size_limit 0

# Retained messages
retained_persistence true
